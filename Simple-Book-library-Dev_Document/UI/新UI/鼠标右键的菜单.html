<!DOCTYPE html>
<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#001c39",
                        "secondary-container": "#e3e2e2",
                        "primary": "#005fac",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#a4c9ff",
                        "surface-container-low": "#f3f3f3",
                        "on-secondary-fixed": "#1b1c1c",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "on-tertiary-fixed": "#001d37",
                        "on-surface-variant": "#414752",
                        "tertiary-fixed": "#d2e4ff",
                        "on-primary-container": "#000510",
                        "surface-container-highest": "#e2e2e2",
                        "on-background": "#1a1c1c",
                        "primary-container": "#0078d7",
                        "inverse-on-surface": "#f1f1f1",
                        "tertiary-fixed-dim": "#9fcaff",
                        "surface-container": "#eeeeee",
                        "outline-variant": "#c0c7d4",
                        "on-secondary-container": "#646464",
                        "secondary-fixed": "#e3e2e2",
                        "on-tertiary-fixed-variant": "#08497c",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9f9",
                        "surface-variant": "#e2e2e2",
                        "primary-fixed": "#d4e3ff",
                        "outline": "#717784",
                        "error-container": "#ffdad6",
                        "tertiary": "#2a5e93",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "background": "#f9f9f9",
                        "surface-tint": "#005fad",
                        "inverse-primary": "#a4c9ff",
                        "on-secondary-fixed-variant": "#464747",
                        "surface-dim": "#dadada",
                        "on-primary-fixed-variant": "#004884",
                        "inverse-surface": "#2f3131",
                        "secondary-fixed-dim": "#c7c6c6",
                        "tertiary-container": "#4677ad",
                        "secondary": "#5e5e5e",
                        "on-tertiary-container": "#fdfcff",
                        "surface-container-high": "#e8e8e8",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px",
                        "lg": "0px",
                        "xl": "0px",
                        "full": "0px"
                    },
                    "fontFamily": {
                        "headline": ["Inter", "Segoe UI", "sans-serif"],
                        "body": ["Inter", "Segoe UI", "sans-serif"],
                        "label": ["Inter", "Segoe UI", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 18px;
        }
        .acrylic-bg {
            background-color: rgba(226, 226, 226, 0.7);
            backdrop-filter: blur(20px);
        }
        .ghost-border {
            outline: 1px solid rgba(192, 199, 212, 0.15);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #005fac 0%, #0078d7 100%);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[320px] bg-surface-container-lowest shadow-[0_20px_40px_rgba(26,28,28,0.12)] ghost-border overflow-hidden">
<div class="h-8 flex items-center justify-between px-3 bg-surface-container-highest/40">
<span class="text-[11px] font-semibold tracking-wider text-on-surface-variant uppercase">添加标签</span>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer hover:text-primary transition-colors" data-icon="close">close</span>
</div>
</div>
<div class="p-5 space-y-6">
<div class="relative z-20">
<label class="block text-[10px] font-bold text-primary uppercase tracking-widest mb-1">标签名称</label>
<div class="flex items-center bg-surface-container-highest px-3 border-b-2 border-primary transition-all group">
<span class="material-symbols-outlined text-primary mr-2" data-icon="search">search</span>
<input class="w-full h-10 bg-transparent border-none focus:ring-0 text-sm placeholder:text-outline" placeholder="输入标签..." type="text" value="设计"/>
</div>
<div class="absolute top-full left-0 w-full bg-surface-container-lowest shadow-lg border border-outline-variant/30 mt-px max-h-48 overflow-y-auto custom-scrollbar">
<div class="flex flex-col">
<button class="flex items-center px-4 py-2.5 text-xs hover:bg-surface-container-low text-on-surface text-left transition-colors">
<span class="material-symbols-outlined text-[14px] mr-2 text-outline" data-icon="label">label</span>
                            视觉设计
                        </button>
<button class="flex items-center px-4 py-2.5 text-xs hover:bg-surface-container-low text-on-surface text-left transition-colors">
<span class="material-symbols-outlined text-[14px] mr-2 text-outline" data-icon="label">label</span>
                            交互设计
                        </button>
<button class="flex items-center px-4 py-2.5 text-xs hover:bg-surface-container-low text-on-surface text-left transition-colors">
<span class="material-symbols-outlined text-[14px] mr-2 text-outline" data-icon="label">label</span>
                            产品设计
                        </button>
<button class="flex items-center px-4 py-3 text-xs bg-primary/5 hover:bg-primary/10 text-primary font-medium text-left transition-colors border-t border-outline-variant/10">
<span class="material-symbols-outlined text-[16px] mr-2" data-icon="add_circle">add_circle</span>
                            创建新标签: <span class="ml-1 font-bold">设计</span>
</button>
</div>
</div>
</div>
<div>
<h3 class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-3">最近标签</h3>
<div class="flex flex-wrap gap-2">
<button class="flex items-center px-3 py-1.5 bg-surface-container-low hover:bg-surface-container-high transition-colors text-xs font-medium text-on-surface group">
<span class="material-symbols-outlined text-[14px] mr-1.5 text-outline group-hover:text-primary" data-icon="history">history</span>
                        心理学
                    </button>
<button class="flex items-center px-3 py-1.5 bg-surface-container-low hover:bg-surface-container-high transition-colors text-xs font-medium text-on-surface group">
<span class="material-symbols-outlined text-[14px] mr-1.5 text-outline group-hover:text-primary" data-icon="history">history</span>
                        技术
                    </button>
<button class="flex items-center px-3 py-1.5 bg-surface-container-low hover:bg-surface-container-high transition-colors text-xs font-medium text-on-surface group">
<span class="material-symbols-outlined text-[14px] mr-1.5 text-outline group-hover:text-primary" data-icon="history">history</span>
                        待买
                    </button>
</div>
</div>
<div class="relative z-10 pt-2">
<h3 class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-3">添加到自定义书单</h3>
<div class="flex items-center bg-surface-container-highest px-3 border-b-2 border-primary transition-all group">
<span class="material-symbols-outlined text-primary mr-2" data-icon="search">search</span>
<input class="w-full h-10 bg-transparent border-none focus:ring-0 text-sm placeholder:text-outline" placeholder="搜索书单..." type="text" value="书"/>
</div>
<div class="absolute top-full left-0 w-full bg-surface-container-lowest shadow-lg border border-outline-variant/30 mt-px max-h-48 overflow-y-auto custom-scrollbar">
<div class="flex flex-col">
<div class="flex items-center justify-between px-4 py-2.5 hover:bg-surface-container-low transition-colors group/item">
<div class="flex items-center min-w-0">
<span class="material-symbols-outlined text-[16px] mr-2 text-outline group-hover/item:text-primary" data-icon="auto_stories">auto_stories</span>
<span class="text-xs text-on-surface truncate">必读书单</span>
</div>
<button class="text-[10px] font-bold text-primary uppercase tracking-wider hover:underline ml-2 flex-shrink-0">添加</button>
</div>
<div class="flex items-center justify-between px-4 py-2.5 hover:bg-surface-container-low transition-colors group/item border-t border-outline-variant/5">
<div class="flex items-center min-w-0">
<span class="material-symbols-outlined text-[16px] mr-2 text-outline group-hover/item:text-primary" data-icon="auto_stories">auto_stories</span>
<span class="text-xs text-on-surface truncate">专业书库</span>
</div>
<button class="text-[10px] font-bold text-primary uppercase tracking-wider hover:underline ml-2 flex-shrink-0">添加</button>
</div>
<div class="flex items-center justify-between px-4 py-2.5 hover:bg-surface-container-low transition-colors group/item border-t border-outline-variant/5">
<div class="flex items-center min-w-0">
<span class="material-symbols-outlined text-[16px] mr-2 text-outline group-hover/item:text-primary" data-icon="auto_stories">auto_stories</span>
<span class="text-xs text-on-surface truncate">参考书目</span>
</div>
<button class="text-[10px] font-bold text-primary uppercase tracking-wider hover:underline ml-2 flex-shrink-0">添加</button>
</div>
<button class="flex items-center px-4 py-3 text-xs bg-primary/5 hover:bg-primary/10 text-primary font-medium text-left transition-colors border-t border-outline-variant/10">
<span class="material-symbols-outlined text-[16px] mr-2" data-icon="library_add">library_add</span>
                            创建新书单: <span class="ml-1 font-bold">书</span>
</button>
</div>
</div>
</div>
<div class="h-[1px] bg-outline-variant/15"></div>
<div class="flex flex-col gap-2">
<button class="w-full h-10 primary-gradient text-on-primary font-semibold text-sm active:opacity-90 transition-all flex items-center justify-center gap-2 group">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    确认添加
                </button>
<button class="w-full h-10 border border-outline/20 text-primary font-semibold text-sm hover:bg-surface-container-low transition-all">
                    取消
                </button>
</div>
</div>
<div class="px-5 py-3 bg-surface-container-low flex items-center justify-between">
<span class="text-[9px] text-outline font-medium uppercase tracking-tight">已选 0 个标签</span>
<div class="flex gap-1">
<div class="w-1 h-1 bg-primary"></div>
<div class="w-1 h-1 bg-outline-variant"></div>
<div class="w-1 h-1 bg-outline-variant"></div>
</div>
</div>
</div>
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[10%] left-[5%] w-64 h-64 bg-primary/5 blur-3xl"></div>
<div class="absolute bottom-[10%] right-[5%] w-96 h-96 bg-tertiary/5 blur-3xl"></div>
<div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.02) 1px, transparent 0); background-size: 32px 32px;"></div>
</div>

</body></html>
