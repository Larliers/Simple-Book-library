name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bump version from latest release
        id: bump
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ github.repository }}"
          $latestTag = ""
          try {
            $latestTag = gh release view --repo $repo --json tagName -q ".tagName"
          } catch {
            $latestTag = ""
          }
          if (-not $latestTag) {
            $latestTag = "v0.0.0"
          }

          $ver = $latestTag.TrimStart("v", "V")
          $parts = $ver.Split(".")
          while ($parts.Count -lt 3) { $parts += "0" }
          [int]$major = $parts[0]
          [int]$minor = $parts[1]
          [int]$patch = $parts[2]

          switch ($env:BUMP) {
            "major" { $major++; $minor = 0; $patch = 0 }
            "minor" { $minor++; $patch = 0 }
            default { $patch++ }
          }

          $newVer = "$major.$minor.$patch"
          $newTag = "v$newVer"

          $versionFile = "src/bookhub/version.py"
          (Get-Content $versionFile) | ForEach-Object {
            if ($_ -match 'APP_VERSION = ') { "APP_VERSION = `"$newVer`"" } else { $_ }
          } | Set-Content $versionFile -Encoding UTF8

          foreach ($readme in @("README.md", "README.en.md")) {
            if (Test-Path $readme) {
              (Get-Content $readme -Raw) -replace '\*\*v\d+\.\d+\.\d+\*\*', "**v$newVer**" |
                Set-Content $readme -NoNewline -Encoding UTF8
            }
          }

          "new_version=$newVer" >> $env:GITHUB_OUTPUT
          "new_tag=$newTag" >> $env:GITHUB_OUTPUT
          Write-Host "Bumped $latestTag -> $newTag (APP_VERSION=$newVer)"

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/bookhub/version.py README.md README.en.md
          git commit -m "chore: release ${{ steps.bump.outputs.new_tag }}"
          git push origin HEAD

      - name: Create and push tag
        shell: pwsh
        run: |
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -r requirements.txt

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: build/nuitka-cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'src/**/*.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-

      - name: Build with Nuitka
        shell: pwsh
        run: .\scripts\build_nuitka.ps1

      - name: Pack release zip
        shell: pwsh
        run: .\scripts\pack_release.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Simple Book Library ${{ steps.bump.outputs.new_tag }}
          generate_release_notes: true
          files: |
            build/release/Simple-Book-library-v${{ steps.bump.outputs.new_version }}-win64.zip
